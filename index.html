<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link
        href="https://fonts.bunny.net/css?family=work-sans:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/calculator.css">
</head>

<body>
    <main>
        <section class="calculator-box">
            <div class="status-bar">
                <div class="time">
                    <p>10:41 am</p>
                </div>
                <div class="notch"></div>
                <div class="indicators">
                    <img src="https://ik.imagekit.io/tujsl2f24/Calculator/icons/Mobile%20Signal.png?updatedAt=1753430626512"
                        alt="network">
                    <img src="https://ik.imagekit.io/tujsl2f24/Calculator/icons/Wifi.png?updatedAt=1753430626335"
                        alt="wifi">
                    <img src="https://ik.imagekit.io/tujsl2f24/Calculator/icons/Rectangle.png?updatedAt=1753430626086"
                        alt="battery">
                </div>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
